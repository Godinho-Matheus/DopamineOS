# Perfil de PRODUÇÃO.
# Todos os valores sensíveis vêm de variáveis de ambiente; nenhum segredo versionado (RNF-14).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # Produção usa SOMENTE a baseline (classpath:db/migration), herdada da config base.
  # A migração de compatibilidade legada (db/migration-devtest) NÃO é aplicada em produção,
  # mantendo o schema de produção limpo (Design §10; task 0.3.8).
  jpa:
    # Schema gerenciado por Flyway; Hibernate apenas valida o mapeamento. NUNCA 'update':
    # divergência de schema FALHA a inicialização em vez de alterar silenciosamente (REQ-014).
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false

# Em produção não expor stacktrace nas respostas de erro.
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# Em produção o cookie de sessão deve ser Secure (HTTPS).
cookie:
  secure: ${COOKIE_SECURE:true}

# CORS de produção vem exclusivamente de CORS_ALLOWED_ORIGINS (sem default).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

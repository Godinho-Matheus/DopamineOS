# Perfil de DESENVOLVIMENTO.
# Defaults de desenvolvimento NÃO sensíveis via placeholder para subir localmente sem exportar tudo.
# A senha NÃO tem default real versionado: use DB_PASSWORD (um default de dev vazio é aceito aqui).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    # Default de desenvolvimento vazio (RNF-14): nenhuma senha real é versionada.
    # Exporte DB_PASSWORD para apontar a um banco com senha.
    password: ${DB_PASSWORD:}
  # Flyway em dev/test aplica a baseline (db/migration) MAIS a migração de compatibilidade
  # legada (db/migration-devtest), que cria tb_usuario/tb_protocolos/tb_log_atividade para que
  # ddl-auto=validate aceite as entidades legadas ainda mapeadas (Design §10; task 0.3.8).
  # PRODUÇÃO NÃO inclui db/migration-devtest (ver application-prod.yml / application.yml base).
  flyway:
    locations: classpath:db/migration,classpath:db/migration-devtest
  jpa:
    # Schema gerenciado por Flyway; Hibernate apenas valida o mapeamento (Design §10).
    # Configurável por env var, mas o default agora é 'validate' (nunca 'update').
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: true

# Erros detalhados em desenvolvimento para facilitar depuração.
server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

# Em desenvolvimento o cookie de sessão não é Secure (HTTP local).
cookie:
  secure: ${COOKIE_SECURE:false}

# CORS de desenvolvimento inclui o frontend Angular local.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

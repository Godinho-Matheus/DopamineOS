# Configuração base (comum a todos os perfis).
# Valores sensíveis vêm de variáveis de ambiente (ver application-dev.yml / application-prod.yml).
# Nenhum segredo real é versionado (RNF-14).
spring:
  application:
    name: lumeos-backend
  profiles:
    # Perfil ativo selecionado por SPRING_PROFILES_ACTIVE; dev é o padrão de desenvolvimento.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # URL montada a partir de DB_HOST/DB_PORT/DB_NAME (defaults de desenvolvimento, não sensíveis).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  # Flyway versiona o schema (Design §10). O schema é criado pelas migrações e o Hibernate
  # apenas valida o mapeamento (ddl-auto=validate). A location base é a de PRODUÇÃO
  # (apenas classpath:db/migration); dev/test acrescentam db/migration-devtest (ver 0.3.8).
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

# Actuator: exposição mínima (apenas health), sem detalhes internos (Design §23).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Chaves de JWT presentes na configuração, lidas de variáveis de ambiente.
# NÃO há uso nem validação de obrigatoriedade nesta fase (segurança real chega na task 1.2).
jwt:
  secret: ${JWT_SECRET:}
  ttl: ${JWT_TTL:3600}

# Cookie de sessão: flag Secure controlada por ambiente (uso real na task 1.2).
cookie:
  secure: ${COOKIE_SECURE:false}

# Origens permitidas de CORS, alimentadas por CORS_ALLOWED_ORIGINS (lista separada por vírgula).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
